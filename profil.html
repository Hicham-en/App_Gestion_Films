<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon profil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <div class="top-bar">
      <span class="who"></span>
      <a href="index.html" data-admin-only>Ajouter un film</a>
      <button type="button" id="logout-btn" class="btn-logout">Déconnexion</button>
    </div>

    <h1>Mon profil</h1>

    <nav class="filters">
      <button type="button" data-filter="all">Tous</button>
      <button type="button" data-filter="favorites">Favoris</button>
      <button type="button" data-filter="watched">Déjà vus</button>
    </nav>

    <div id="films-list"></div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
