<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créer un compte</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container auth-container">
    <h1>Créer un compte</h1>

    <form id="register-form">
      <fieldset>
        <legend>Identifiants</legend>

        <div id="register-alert" class="alert" hidden></div>

        <div class="form-group">
          <label for="register-username">Identifiant</label>
          <input type="text" id="register-username" name="username" required>
        </div>

        <div class="form-group">
          <label for="register-password">Mot de passe</label>
          <input
            type="password"
            id="register-password"
            name="password"
            required
          >
          <ul class="password-rules">
            <li>Au moins 4 caractères</li>
            <li>Une majuscule</li>
            <li>Une minuscule</li>
            <li>Un chiffre</li>
            <li>Un caractère spécial</li>
          </ul>
        </div>

        <div class="form-group">
          <label for="register-password2">Confirmer le mot de passe</label>
          <input type="password" id="register-password2" name="password2" required>
        </div>

        <p class="form-hint">
          L'inscription crée un compte <strong>client</strong>.
          Le compte administrateur du projet est déjà créé.
        </p>
      </fieldset>

      <button type="submit" class="btn-submit">Créer le compte</button>
    </form>

    <nav class="auth-nav">
      <a href="login.html">Se connecter</a>

    </nav>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
