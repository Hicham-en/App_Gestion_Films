<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter un film</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Administration — Ajouter un film</h1>

    <form id="add-movie-form" class="movie-form">
      <fieldset>
        <legend>Informations générales</legend>

        <div class="form-group">
          <label for="title">Titre du film</label>
          <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
          <label for="genre">Tags / Genres</label>
          <input type="text" id="genre" name="genre" placeholder="Ex. : Sci-Fi, Drame, Thriller">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="release-date">Date de sortie</label>
            <input type="date" id="release-date" name="release_date" required>
          </div>

          <div class="form-group">
            <label for="rating">Note (sur 10)</label>
            <input type="number" id="rating" name="rating" min="0" max="10" step="0.5">
          </div>
        </div>

        <div class="form-group">
          <label for="director">Réalisateur</label>
          <input type="text" id="director" name="director" required>
        </div>

        <div class="form-group">
          <label for="synopsis">Résumé</label>
          <textarea id="synopsis" name="synopsis" rows="4"></textarea>
        </div>
      </fieldset>

      <fieldset>
        <legend>Acteurs principaux (3 max)</legend>
        <div class="grid-3">
          <div class="form-group">
            <label for="actor-1">Acteur 1</label>
            <input type="text" id="actor-1" name="actors[]">
          </div>
          <div class="form-group">
            <label for="actor-2">Acteur 2</label>
            <input type="text" id="actor-2" name="actors[]">
          </div>
          <div class="form-group">
            <label for="actor-3">Acteur 3</label>
            <input type="text" id="actor-3" name="actors[]">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Diffusion</legend>

        <div class="form-group-checkbox">
          <input type="checkbox" id="cinema-only" name="cinema_only">
          <label for="cinema-only">Sortie exclusivement en salle de cinéma</label>
        </div>

        <div class="form-group" id="cinema-room-group">
          <label for="cinema-room">Salle(s) de diffusion</label>
          <input type="text" id="cinema-room" name="cinema_room" placeholder="Ex. : Salle 4, Cinéma Alhambra...">
        </div>

        <div class="form-group" id="platforms-group">
          <label>Plateformes de streaming disponibles</label>
          <div class="platforms-list">
            <label><input type="checkbox" name="platforms[]" value="netflix"> Netflix</label>
            <label><input type="checkbox" name="platforms[]" value="prime"> Prime Video</label>
            <label><input type="checkbox" name="platforms[]" value="disney"> Disney+</label>
            <label><input type="checkbox" name="platforms[]" value="canal"> Canal+</label>
          </div>
        </div>
      </fieldset>

      <button type="submit" class="btn-submit">Ajouter le film</button>
    </form>
  </main>
  </body>
</html>
